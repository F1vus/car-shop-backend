spring.application.name=CarShopBackend
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.flyway.enabled=false

logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

jwt.secret-base64=I2uOVEgOASfJq02I4OAagIaYPO09Tzg7cApgK6OGCO5D2/sbQKykc8DSEz6EDY4RQ1yTDljD216LNaNsjqFSpQ==
# 1 hour
jwt.lifetime=3600000
# 7 days
jwt.refresh-token.lifetime=604800000


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_EMAIL_USERNAME}
spring.mail.password=${SPRING_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

car-shop-webpage-url=http://localhost:5173/